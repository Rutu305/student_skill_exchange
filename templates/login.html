{% extends 'base.html' %}

{% block title %}Login | SkillSwap{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Welcome Back</h2>
            <p>Login to continue your peer skill exchange journey</p>
        </div>

        {% if error %}
            <div class="alert alert-danger">
                <span>{{ error }}</span>
            </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" value="{{ request.form.get('email', '') }}" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>

            <div class="forgot-link-wrap">
                <a href="{{ url_for('forgot_password') }}">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">
                Log In
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="{{ url_for('register') }}">Register here</a>
        </div>
    </div>
</div>
{% endblock %}
