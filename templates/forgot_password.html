{% extends 'base.html' %}

{% block title %}Verify Account | SkillSwap{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Verify Account</h2>
            <p>Enter your registered email and mobile number to reset password</p>
        </div>

        {% if error %}
            <div class="alert alert-danger">
                <span>{{ error }}</span>
            </div>
        {% endif %}

        <form method="POST" action="{{ url_for('forgot_password') }}" id="verifyForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="Enter your registered email" value="{{ request.form.get('email', '') }}" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" class="form-control" placeholder="Enter 10-digit phone number" maxlength="10" required>
            </div>

            <button type="submit" id="verifyBtn" class="btn btn-success" style="width: 100%; margin-top: 0.8rem;" disabled>
                Verify & Continue
            </button>
        </form>

        <div class="auth-footer">
            <a href="{{ url_for('login') }}">← Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    const emailInput = document.getElementById('email');
    const phoneInput = document.getElementById('phone');
    const verifyBtn = document.getElementById('verifyBtn');

    function checkInputs() {
        const email = emailInput.value.trim();
        const phone = phoneInput.value.trim();
        const validEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        const validPhone = /^[0-9]{10}$/.test(phone);

        const ok = validEmail && validPhone;
        verifyBtn.disabled = !ok;
        verifyBtn.style.opacity = ok ? '1' : '0.6';
        verifyBtn.style.cursor = ok ? 'pointer' : 'not-allowed';
    }

    emailInput.addEventListener('input', checkInputs);
    phoneInput.addEventListener('input', function() {
        this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10);
        checkInputs();
    });

    checkInputs();
</script>
{% endblock %}
